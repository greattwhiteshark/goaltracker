<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker V2</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></head>
<body>
    <div id="app" class="container-sm my-3">
        <h2 id="appheading" class="text-center">Welcome to goal tracking application</h2>
        <br>

        <div id="goal-form">
            <div class="row my-3">
                <div class="col-sm-12">
                    <textarea  id="goalname" class="form-control" rows="4"
                    placeholder="enter goal, example i want to complete this project by today"
                    style="border-radius: 20px;"
                    ></textarea>
                </div>
            </div>
            <div class="row my-3">
                <div class="col-sm-12 d-flex justify-content-center">
                    <input type="button" class="btn btn-success custom-rounded-button" value="Submit" id="savegoal" >
                </div>
            </div>
            
        </div>
        <br>
        <div id="current-goal" style="display: none;">
            <h2 id="current-goal-name" class="text-center"></h2>
            <div id="current-goal-details"></div>
            <div class="row my-3">
                <div class="col-sm-12">
                    <textarea name="" id="challangename" rows="4"
                    placeholder="enter challange, example i am feeling bored"
                    class="form-control"
                    style="border-radius: 20px;"
                    ></textarea>
                </div>
            </div>
            <div class="row my-3 justify-content-center">
                <div class="col-sm-4 text-danger d-flex align-items-center justify-content-center">
                    <label for="isQuit" class="mr-2">Quit?</label>&nbsp
                    <input type="checkbox" id="isQuit">
                </div>
                <div class="col-sm-4 d-flex justify-content-center">
                    <input type="button" value="Add Challenge" id="addchallange" class="btn btn-primary custom-rounded-button my-2">
                </div>
                <div class="col-sm-4 d-flex justify-content-center">
                    <button id="complete-goal" onclick="markGoalAsCompleted()" class="btn btn-success custom-rounded-button">Completed</button>
                </div>
            </div>
            
           
            
            <!-- <div id="challenges-list" style="display: none;">
                <h3>challanges list</h3>
                <ul id="challanges"></ul> 
            </div> -->

            <div class="container my-3">
                <div id="challenges-list" class="d-none">
                    <h3 class="text-center">Challenges List</h3>
                    <ul id="challanges" class="list-group"></ul> 
                </div>
            </div>
            

        </div>
        <br>
        

        <div class="container my-3">
            <div id="goal-history" class="d-none">
                
                <h3 class="text-center">Goal History</h3>
                <ul id="goal-history-list" class="list-group"></ul>
                <br>
                <h3 id="goalChallangeHeading" class="d-none"></h3>
                <ul id="goal-challange-history" class="list-group">
                </ul>
            </div>
        </div>

       

        

    </div>
    <script src="script.js"></script>
</body>
</html>
