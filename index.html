<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker V2</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></head>
<body>
    <div id="app" class="container-sm my-3">
        
        <h2 id="appheading" class="text-center">Welcome to goal tracking application</h2>
       
          
        <br>

        <div id="goal-form">
            <div class="row my-3">
                <div class="col-sm-12">
                    <textarea  id="goalname" class="form-control" rows="4"
                    placeholder="enter goal, example i want to complete this project by today"
                    style="border-radius: 20px;"
                    ></textarea>
                </div>
            </div>
            <div class="row my-3">
                <div class="col-sm-12 d-flex justify-content-center">
                    <input type="button" class="btn btn-success custom-rounded-button" value="Submit" id="savegoal" >
                </div>
            </div>
            
        </div>
        <br>
        <div id="current-goal" style="display: none;">
            <h2 id="current-goal-name" class="text-center"></h2>
            <div id="current-goal-details"></div>
            <div class="row my-3">
                <div class="col-sm-12">
                    <textarea name="" id="challangename" rows="4"
                    placeholder="enter any remarks"
                    class="form-control"
                    style="border-radius: 20px;"
                    ></textarea>
                </div>
            </div>
            <div class="row my-3 justify-content-center">
                <div class="col-md-6">
                  <div class="card p-4 shadow-sm border-0 rounded-4">
                    <div class="mb-3">
                      <label for="selectedAction" class="form-label fw-bold">Choose an Action</label>
                      <select id="selectedAction" class="form-select form-select-lg rounded-pill">
                        <option value="">Select an action</option>
                        <option value="milestone">Milestone</option>
                        <option value="challenge">Challenge</option>
                        <option value="planned break">Planned Break</option>
                        <option value="continue">Continue</option>
                        <option value="quit">Quit</option>
                        <option value="completed">Completed Successfully</option>
                      </select>
                    </div>
                    <div class="d-grid">
                      <button id="multiple-action-btn" class="btn btn-primary btn-lg rounded-pill">
                        OK
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              
            
           
            <div class="container my-3">
                <div id="challenges-list" class="d-none">
                    <h3 class="text-center">Challenges List</h3>
                    <ul id="challanges" class="list-group"></ul> 
                </div>
            </div>
            

        </div>
        <br>
        

        <div class="container my-3">
            <div id="goal-history" class="d-none">
                
                <h3 class="text-center">Goal History</h3>
                <ul id="goal-history-list" class="list-group"></ul>
                <br>
                <h3 id="goalChallangeHeading" class="d-none"></h3>
                <ul id="goal-challange-history" class="list-group">
                </ul>
            </div>
        </div>

       

        

    </div>
    <script src="script.js"></script>
</body>
</html>
